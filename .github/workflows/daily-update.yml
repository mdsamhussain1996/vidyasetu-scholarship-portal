name: "Daily Opportunities Discovery & Verification"

on:
  schedule:
    # Daily at 02:30 UTC ≈ 08:00 IST
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute Current Date
        id: get-date
        run: |
          echo "date=$(date +%F)" >> $GITHUB_OUTPUT

      - name: Run Discovery & Verification Engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # If Sunday, include link health check
          if [ "$(date +%u)" = "7" ]; then
            python scripts/discover.py --check-links
          else
            python scripts/discover.py
          fi

      - name: Validate Dataset Integrity Before Commit
        id: validate
        run: |
          python scripts/validate.py

      - name: Check for modified files to commit to main
        id: git-check
        run: |
          git status --porcelain data/opportunities.json data/meta.json data/source_hashes.json data/archive.json
          if [ -n "$(git status --porcelain data/opportunities.json data/meta.json data/source_hashes.json data/archive.json 2>/dev/null)" ]; then
            echo "has_main_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_main_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push Verified Updates to Main
        if: steps.git-check.outputs.has_main_changes == 'true' && steps.validate.outcome == 'success'
        run: |
          git config user.name "VidyaSetu Automation Bot"
          git config user.email "actions@github.com"
          git add data/opportunities.json data/meta.json data/source_hashes.json
          if [ -f data/archive.json ]; then git add data/archive.json; fi
          git commit -m "chore(data): automated daily opportunities update [${{ steps.get-date.outputs.date }}]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Pending Review Items
        id: pending-check
        run: |
          if [ -f data/pending.json ] && [ "$(jq '. | length' data/pending.json 2>/dev/null || echo 0)" -gt 0 ]; then
            echo "has_pending=true" >> $GITHUB_OUTPUT
          else
            echo "has_pending=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request for Pending Review
        if: steps.pending-check.outputs.has_pending == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(data): new opportunities submitted for human review [${{ steps.get-date.outputs.date }}]"
          title: "New opportunities for review – ${{ steps.get-date.outputs.date }}"
          body: |
            ### Automated Discovery Review Required (${{ steps.get-date.outputs.date }})
            New educational opportunities were scraped or submitted and placed in `data/pending.json` for human verification.
            
            - Please verify official provider authenticity.
            - Ensure no registration fee or payment is demanded.
            - Once approved, merge this PR to add them to `data/opportunities.json`.
          branch: "auto-update/pending-review-${{ steps.get-date.outputs.date }}"
          add-paths: "data/pending.json"
          delete-branch: true
